services:
  - type: web
    name: edusense-student-emotion-detection
    runtime: python
    plan: free
    rootDir: student-emotion-detection
    buildCommand: pip install -r requirements-cpu.txt
    startCommand: python -m streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PYTHONUNBUFFERED
        value: "1"
